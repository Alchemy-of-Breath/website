<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You've Been Removed | Alchemy of Breath</title>
<meta name="description" content="You've been removed from that list.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF7EF">
<link rel="icon" type="image/png" href="https://alchemyofbreath.com/wp-content/uploads/AOB-Gold-Black-Transparant-symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper-2:#FBF7EF;--cream:#FDF6E9;--gold:#E1B668;--gold-deep:#D6A652;--slate:#5B7889;--ink:#221F20;
  --serif:'Marcellus',Georgia,'Times New Roman',serif;
  --sans:'Roboto',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);font-weight:300;font-size:18px;line-height:1.7;color:var(--ink);background:radial-gradient(120% 90% at 50% 0%,var(--cream) 0%,var(--paper-2) 70%);min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;height:auto;display:block}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.orb.g{background:radial-gradient(circle,rgba(225,182,104,.24) 0%,rgba(225,182,104,0) 70%)}
.orb.t{background:radial-gradient(circle,rgba(0,165,178,.13) 0%,rgba(0,165,178,0) 70%)}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:48px 24px;text-align:center}
.logo{height:40px;width:auto;margin:0 auto 46px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,7vw,3rem);line-height:1.15;letter-spacing:-.01em;margin-bottom:14px}
h1 em{color:var(--gold-deep);font-style:italic}
.sub{font-size:1.05rem;color:var(--slate)}
.line{width:44px;height:1px;background:var(--gold);margin:34px auto 0}
</style>
</head>
<body>

<div class="orb g" style="width:560px;height:560px;top:-220px;left:-200px" aria-hidden="true"></div>
<div class="orb t" style="width:520px;height:520px;bottom:-220px;right:-190px" aria-hidden="true"></div>

<main class="wrap">
  <img class="logo" src="https://alchemyofbreath.com/wp-content/uploads/AOB-Gold-Black-Transparant.png" alt="Alchemy of Breath" width="252" height="72" decoding="async">
  <h1><em>Done.</em></h1>
  <p class="sub">You&rsquo;ve been removed from that list.</p>
  <div class="line" aria-hidden="true"></div>
</main>

<script>(function(){if(window.self!==window.top){function r(){window.parent.postMessage({type:'aob-embed-resize',height:document.documentElement.scrollHeight},'*');}window.addEventListener('load',r);window.addEventListener('resize',r);}})();</script>
</body>
</html>
