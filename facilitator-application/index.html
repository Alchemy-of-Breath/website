<script>
/* AoB UTM keeper: remembers the campaign tags a visitor arrived with and hands
   them to GoHighLevel on whatever page they later sign up on.
   - Stores utm_*, fbclid, gclid, msclkid from the landing URL for 90 days
     (latest campaign wins), in localStorage and an .alchemyofbreath.com cookie.
   - Seeds GHL's own form_embed.js memory (sessionStorage "UPS"), so GHL forms
     attribute the contact to the campaign even when the form page has no tags.
   - Adds the tags to GHL form/booking iframes and to links into GHL funnels
     (go. / breathcamp. / link.alchemyofbreath.com), so hidden fields with a
     matching query key are filled too.
   Source: tools/utm/aob-utm.js. Inlined into every page by tools/utm/inject.py. */
(function(){
  var KEYS=['utm_source','utm_medium','utm_campaign','utm_term','utm_content','utm_id','fbclid','gclid','msclkid'];
  var STORE='aob_utm', DAYS=90, MS=DAYS*864e5;
  var ls=function(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } };
  var qs=new URLSearchParams(location.search), got={}, any=false;
  KEYS.forEach(function(k){ var v=qs.get(k); if(v){ got[k]=v.slice(0,250); any=true; } });
  var rec=null;
  if(any){
    rec={p:got,t:Date.now(),landing:location.origin+location.pathname};
    ls(STORE,JSON.stringify(rec));
    try{ document.cookie=STORE+'='+encodeURIComponent(JSON.stringify(got))+';path=/;max-age='+(DAYS*86400)+';SameSite=Lax'+
      (/(^|\.)alchemyofbreath\.com$/.test(location.hostname)?';domain=.alchemyofbreath.com':''); }catch(e){}
  } else {
    try{ rec=JSON.parse(ls(STORE)||'null'); }catch(e){ rec=null; }
    if(!rec || !rec.p || Date.now()-rec.t>MS) return;
  }
  var P=rec.p;

  // GHL form_embed.js falls back to sessionStorage "UPS" when the page URL has no utm_ tags
  try{
    var ups=new URLSearchParams(sessionStorage.getItem('UPS')||''), changed=false;
    for(var k in P){ if(k.indexOf('utm_')===0 && ups.get(k)!==P[k]){ ups.set(k,P[k]); changed=true; } }
    if(changed) sessionStorage.setItem('UPS','?'+ups.toString());
  }catch(e){}

  var GHL=/^https:\/\/((link|api)\.(alchemyofbreath\.com|leadconnectorhq\.com)\/widget\/(form|survey|booking|quiz)\/|(go|breathcamp)\.alchemyofbreath\.com\/)/;
  var withTags=function(url){
    var u; try{ u=new URL(url,location.href); }catch(e){ return null; }
    if(!GHL.test(u.href)) return null;
    var ch=false;
    for(var k in P){ if(!u.searchParams.has(k)){ u.searchParams.set(k,P[k]); ch=true; } }
    return ch?u.href:null;
  };
  var fixFrame=function(f){
    ['src','data-src'].forEach(function(a){ var v=f.getAttribute(a), n=v&&withTags(v); if(n) f.setAttribute(a,n); });
  };
  var scan=function(root){
    if(root.tagName==='IFRAME'){ fixFrame(root); return; }
    if(root.querySelectorAll) [].forEach.call(root.querySelectorAll('iframe'),fixFrame);
  };
  scan(document);
  if('MutationObserver' in window){
    new MutationObserver(function(ms){ ms.forEach(function(m){ [].forEach.call(m.addedNodes,function(n){ if(n.nodeType===1) scan(n); }); }); })
      .observe(document.documentElement,{childList:true,subtree:true});
  }
  // links into GHL funnels: tag them at click time (covers links built by scripts too)
  var tagLink=function(e){
    var a=e.target && e.target.closest && e.target.closest('a[href]'); if(!a) return;
    var n=withTags(a.getAttribute('href')); if(n) a.setAttribute('href',n);
  };
  document.addEventListener('mousedown',tagLink,true);
  document.addEventListener('touchstart',tagLink,{capture:true,passive:true});
  document.addEventListener('keydown',function(e){ if(e.key==='Enter') tagLink(e); },true);
  document.addEventListener('click',tagLink,true);
})();

      return ['facilitator_intent', 'first_name', 'last_name', 'email'].indexOf(q.id) > -1;
    if (answers.investment_readiness === NOT_READY &&
        ['investment_amount', 'payment_preference', 'call_commitment'].indexOf(q.id) > -1) return false;
    return true;
  }
  function outcome() {
    if (answers.facilitator_intent === 'No') return 'not_facilitator';
    if (answers.investment_readiness === NOT_READY) return 'not_ready_to_invest';
    if (answers.call_commitment === 'No') return 'cannot_commit';
    return 'booking';
  }

  /* ================= STATE ================= */
  var DRAFT_KEY = 'aob-facilitator-application-v1';
  var LETTERS = 'ABCDEFGHIJ';
  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  var mq = function (s) { return !!(window.matchMedia && window.matchMedia(s).matches); };
  var coarse = mq('(pointer: coarse)');
  var reduceMotion = mq('(prefers-reduced-motion: reduce)');
  var answers = loadDraft();
  var hadDraft = Object.keys(answers).length > 0;
  var screens = {};
  var currentId = null;
  var busy = false;
  var advanceTimer = null;

  var params = new URLSearchParams(location.search);
  var tracking = {};
  ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'gclid', 'fbclid'].forEach(function (k) {
    tracking[k] = params.get(k) || '';
  });
  // When embedded on alchemyofbreath.com the parent page forwards its own URL, referrer and query string.
  tracking.referrer = params.get('embed_ref') || document.referrer || '';
  tracking.page_url = params.get('embed_page') || (location.origin + location.pathname);

  var OTHER = '__other__';
  QUESTIONS.forEach(function (q) {
    if (q.options) q.keys = q.options.map(function (o, i) {
      return (q.options.length === 2 && q.options[0] === 'Yes') ? o.charAt(0) : LETTERS.charAt(i);
    });
    if (q.other) q.keys.push(LETTERS.charAt(q.options.length));
  });

  /* ================= HELPERS ================= */
  function h(tag, props, kids) {
    var n = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v == null) return;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function svg(path, size) {
    var s = size || 14;
    return h('span', { 'aria-hidden': 'true', style: 'display:inline-flex',
      html: '<svg width="' + s + '" height="' + s + '" viewBox="0 0 16 16"><path d="' + path + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' });
  }
  var ARROW = 'M3 8h9M8.5 4.5 12 8l-3.5 3.5';
  var CHECK = 'M3 8.5l3.2 3.2L13 4.8';

  function isDemo() { return !CONFIG.webhookUrl; }
  function qById(id) { for (var i = 0; i < QUESTIONS.length; i++) if (QUESTIONS[i].id === id) return QUESTIONS[i]; return null; }
  function visibleList() { return QUESTIONS.filter(isVisible); }
  function val(id) {
    if (answers[id] === OTHER) {
      var t = String(answers[id + '_other'] || '').trim();
      return t ? 'Other: ' + t : '';
    }
    return String(answers[id] || '').trim();
  }

  function loadDraft() {
    try {
      var d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
      if (d && d.answers && Date.now() - d.at < 14 * 864e5) return d.answers;
    } catch (e) {}
    return {};
  }
  function saveDraft() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ answers: answers, at: Date.now() })); } catch (e) {} }
  function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

  /* ================= RENDER ================= */
  var stage = document.getElementById('stage');

  function renderWelcome() {
    var start = h('button', { type: 'button', class: 'btn', onclick: next }, ['Begin', svg(ARROW)]);
    var el = h('section', { class: 'screen', id: 's-welcome' }, [
      h('div', { class: 'q' }, [
        h('p', { class: 'eyebrow', text: 'Certified Breathwork Facilitator Training' }),
        h('h1', { class: 'display', tabindex: '-1', html: 'Your application, and a call <em>shaped around it</em>' }),
        h('p', { class: 'lede', text: 'A few questions about where you are and where you want to go. Our Success Advisors read every answer before your discovery call, so the conversation starts where you are.' }),
        hadDraft ? h('p', { class: 'note', text: 'Welcome back. Your earlier answers are still here.' }) : null,
        h('div', { class: 'actions' }, [start, coarse ? null : h('span', { class: 'hint', html: 'press <b>Enter ↵</b>' })]),
        h('p', { class: 'meta' }, [
          h('span', { text: 'About 5 minutes' }),
          h('span', { text: 'The glow breathes at 5.5 breaths a minute. Breathe with it, if you like.' })
        ])
      ])
    ]);
    screens.welcome = { el: el, focus: el.querySelector('h1') };
    stage.appendChild(el);
  }

  function renderQuestion(q) {
    var num = h('span', { class: 'n' });
    var title = h('h2', { class: 'q-title', id: 't-' + q.id, tabindex: '-1', text: q.title });
    var head = h('div', { class: 'q-head' }, [h('div', { class: 'q-num', 'aria-hidden': 'true' }, [num, svg(ARROW, 12)]), title]);
    var help = q.helpHtml ? h('p', { class: 'q-help', html: q.helpHtml }) : (q.help ? h('p', { class: 'q-help', text: q.help }) : null);
    var err = h('p', { class: 'err', role: 'alert', hidden: '' });
    var status = h('p', { class: 'status', role: 'status', hidden: '' });
    var s = { q: q, num: num, err: err, status: status };
    var body, actions = null;

    if (q.type === 'choice') {
      s.choiceBtns = [];
      body = h('div', { class: 'choices', role: 'radiogroup', 'aria-labelledby': 't-' + q.id });
      q.options.forEach(function (opt, i) {
        var b = h('button', { type: 'button', class: 'choice', role: 'radio', 'aria-checked': String(answers[q.id] === opt) }, [
          h('span', { class: 'key', 'aria-hidden': 'true', text: q.keys[i] }),
          h('span', { text: opt }),
          h('span', { class: 'tick' }, [svg(CHECK, 16)])
        ]);
        b.addEventListener('click', function () { choose(q, i); });
        s.choiceBtns.push(b);
        body.appendChild(b);
      });
      if (q.other) {
        var isOther = answers[q.id] === OTHER;
        var ob = h('button', { type: 'button', class: 'choice', role: 'radio', 'aria-checked': String(isOther) }, [
          h('span', { class: 'key', 'aria-hidden': 'true', text: q.keys[q.options.length] }),
          h('span', {}, [q.other.label, h('span', { class: 'other-hint', text: ' · type your own' })]),
          h('span', { class: 'tick' }, [svg(CHECK, 16)])
        ]);
        ob.addEventListener('click', function () { chooseOther(q); });
        s.choiceBtns.push(ob);
        body.appendChild(ob);
        var oin = h('input', { id: 'f-' + q.id + '-other', type: 'text', placeholder: q.other.placeholder, autocomplete: 'off', 'aria-label': q.other.label });
        oin.value = answers[q.id + '_other'] || '';
        oin.addEventListener('input', function () {
          answers[q.id + '_other'] = oin.value;
          if (!err.hidden) setError(q, '');
          saveDraft();
        });
        s.btn = h('button', { type: 'button', class: 'btn', onclick: next });
        s.otherInput = oin;
        s.otherField = h('div', { class: 'field other-field' }, [oin,
          h('div', { class: 'actions' }, [s.btn, coarse ? null : h('span', { class: 'hint', html: 'press <b>Enter ↵</b>' })])]);
        s.otherField.hidden = !isOther;
      }
    } else {
      var input = q.type === 'long'
        ? h('textarea', { id: 'f-' + q.id, rows: '1', placeholder: 'Type your answer here…', 'aria-labelledby': 't-' + q.id })
        : h('input', { id: 'f-' + q.id, type: q.type === 'short' ? 'text' : q.type, placeholder: q.placeholder || 'Type your answer here…',
            autocomplete: q.autocomplete || 'off', inputmode: q.type === 'tel' ? 'tel' : null, 'aria-labelledby': 't-' + q.id,
            autocapitalize: q.type === 'email' ? 'off' : null, spellcheck: q.contact ? 'false' : null });
      input.value = answers[q.id] || '';
      input.addEventListener('input', function () {
        answers[q.id] = input.value;
        if (!err.hidden) setError(q, '');
        if (q.type === 'long') autosize(input);
        saveDraft();
      });
      body = h('div', { class: 'field' }, [input]);
      s.input = input;
      s.btn = h('button', { type: 'button', class: 'btn', onclick: next });
      var hint = coarse ? null : h('span', { class: 'hint', html: q.type === 'long'
        ? 'press <b>Enter ↵</b> · <b>Shift + Enter</b> for a new line' : 'press <b>Enter ↵</b>' });
      actions = h('div', { class: 'actions' }, [s.btn, hint]);
    }

    var inner = h('div', { class: 'q' }, [head, help, body, s.otherField || null, err, status, actions]);
    s.el = h('section', { class: 'screen', id: 's-' + q.id, 'aria-labelledby': 't-' + q.id }, [inner]);
    s.inner = inner;
    s.focus = s.input || title;
    screens[q.id] = s;
    stage.appendChild(s.el);
  }

  function renderEndShell() {
    var el = h('section', { class: 'screen', id: 's-end' }, [h('div', { class: 'q', id: 'endInner' })]);
    screens.end = { el: el };
    stage.appendChild(el);
  }

  function autosize(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }

  /* ================= NAVIGATION ================= */
  function show(id, dir) {
    var prev = currentId && screens[currentId];
    var nxt = screens[id];
    if (prev && prev !== nxt) {
      prev.el.classList.remove('is-active');
      prev.el.classList.toggle('is-past', dir > 0);
      prev.el.setAttribute('aria-hidden', 'true');
      prev.el.inert = true;
    }
    nxt.el.classList.add('no-trans');
    nxt.el.classList.toggle('is-past', dir < 0);
    void nxt.el.offsetWidth;
    nxt.el.classList.remove('no-trans');
    nxt.el.classList.remove('is-past');
    nxt.el.classList.add('is-active');
    nxt.el.removeAttribute('aria-hidden');
    nxt.el.inert = false;
    nxt.el.scrollTop = 0;
    currentId = id;

    var q = qById(id);
    if (q) {
      var list = visibleList();
      var idx = list.indexOf(q);
      nxt.num.textContent = String(idx + 1);
      if (nxt.btn) {
        nxt.btn.textContent = '';
        var last = idx === list.length - 1;
        nxt.btn.appendChild(document.createTextNode(last ? 'Submit' : 'OK'));
        nxt.btn.appendChild(svg(last ? ARROW : CHECK, 14));
      }
      if (nxt.input && q.type === 'long') setTimeout(function () { autosize(nxt.input); }, 0);
      setProgress(idx / list.length * 100);
    } else setProgress(id === 'end' ? 100 : 0);

    document.getElementById('navUp').disabled = (id === 'welcome' || id === 'end');
    document.getElementById('navDown').disabled = (id === 'end');

    setTimeout(function () {
      if (currentId !== id || !nxt.focus) return;
      var useInput = nxt.input && !coarse;
      (useInput ? nxt.input : (nxt.input ? nxt.el.querySelector('.q-title') : nxt.focus)).focus({ preventScroll: true });
    }, reduceMotion ? 20 : 120);
  }

  function setProgress(p) {
    document.getElementById('progress').style.width = p + '%';
    document.querySelector('.progress').setAttribute('aria-valuenow', String(Math.round(p)));
  }

  function next() {
    if (busy) return;
    clearTimeout(advanceTimer);
    if (currentId === 'welcome') { show(visibleList()[0].id, 1); return; }
    var q = qById(currentId);
    if (!q) return;
    var msg = validate(q);
    setError(q, msg);
    if (msg) { shake(screens[q.id].inner); return; }
    if (q.type === 'tel') answers.phone = val('phone');
    saveDraft();
    var list = visibleList();
    var i = list.indexOf(q);
    if (i < list.length - 1) show(list[i + 1].id, 1);
    else submit(q);
  }

  function prev() {
    if (busy) return;
    clearTimeout(advanceTimer);
    var q = qById(currentId);
    if (!q) return;
    var list = visibleList();
    var i = list.indexOf(q);
    show(i > 0 ? list[i - 1].id : 'welcome', -1);
  }

  function choose(q, i) {
    if (busy) return;
    var s = screens[q.id];
    answers[q.id] = q.options[i];
    saveDraft();
    s.choiceBtns.forEach(function (b, j) { b.setAttribute('aria-checked', String(i === j)); });
    if (s.otherField) s.otherField.hidden = true;
    setError(q, '');
    var b = s.choiceBtns[i];
    b.classList.remove('blink'); void b.offsetWidth; b.classList.add('blink');
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(function () { if (currentId === q.id) next(); }, reduceMotion ? 150 : 450);
  }

  function chooseOther(q) {
    if (busy) return;
    var s = screens[q.id];
    clearTimeout(advanceTimer);
    answers[q.id] = OTHER;
    saveDraft();
    s.choiceBtns.forEach(function (b, j) { b.setAttribute('aria-checked', String(j === q.options.length)); });
    s.otherField.hidden = false;
    setError(q, '');
    setTimeout(function () { s.otherInput.focus({ preventScroll: true }); }, 30);
  }

  function validate(q) {
    if (answers[q.id] === OTHER && !val(q.id)) return 'Type your answer, or pick one of the options';
    var v = val(q.id);
    if (!v) return q.type === 'choice' ? 'Choose one of the options to continue' : 'Please fill this in to continue';
    if (q.type === 'email' && !EMAIL_RE.test(v)) return 'That email looks incomplete. Use the format name@example.com';
    if (q.type === 'tel') {
      if (v.charAt(0) !== '+') return 'Start with your country code, for example +44 or +1';
      var d = v.replace(/\D/g, '');
      if (d.length < 7 || d.length > 15) return 'That number looks too short or too long. Check it and try again';
    }
    return '';
  }

  function setError(q, msg) {
    var e = screens[q.id].err;
    e.textContent = msg;
    e.hidden = !msg;
  }
  function shake(node) {
    node.classList.remove('shake'); void node.offsetWidth; node.classList.add('shake');
  }

  /* ================= SUBMIT ================= */
  function buildPayload(o) {
    var p = { source: CONFIG.source, outcome: o, outcome_tag: 'fa-' + o.replace(/_/g, '-'), submitted_at: new Date().toISOString() };
    QUESTIONS.forEach(function (q) { p[q.id] = isVisible(q) ? val(q.id) : ''; });
    if (p.phone) p.phone = '+' + p.phone.replace(/\D/g, '');
    p.summary = QUESTIONS.filter(function (q) { return isVisible(q) && !q.contact; })
      .map(function (q) { return q.title + '\n→ ' + (val(q.id) || '—'); }).join('\n\n');
    Object.keys(tracking).forEach(function (k) { p[k] = tracking[k]; });
    return p;
  }

  function post(payload) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 10000);
    return fetch(CONFIG.webhookUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      keepalive: true,
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) {
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
    }, function (e) { clearTimeout(timer); throw e; });
  }

  function send(payload) {
    if (isDemo()) return Promise.resolve();
    return post(payload).catch(function () {
      return new Promise(function (res) { setTimeout(res, 1500); }).then(function () { return post(payload); });
    });
  }

  function submit(q) {
    busy = true;
    var s = screens[q.id];
    var o = outcome();
    var payload = buildPayload(o);
    if (s.btn) { s.btn.disabled = true; s.btn.textContent = 'Sending…'; }
    s.status.textContent = 'Sending your answers…';
    s.status.hidden = false;
    send(payload).then(function () {
      busy = false;
      s.status.hidden = true;
      if (s.btn) s.btn.disabled = false;
      clearDraft();
      if (window.fbq && !isDemo()) fbq('track', 'SubmitApplication', { content_name: 'Facilitator Application', outcome: o });
      renderEnd(o, payload);
      show('end', 1);
    }, function () {
      busy = false;
      s.status.hidden = true;
      if (s.btn) { s.btn.disabled = false; s.btn.textContent = 'Submit'; }
      setError(q, 'We couldn’t send your answers. Check your connection and ' + (q.type === 'choice' ? 'choose again.' : 'press Submit again.'));
    });
  }

  function calendarLink(p) {
    var u;
    try { u = new URL(CONFIG.calendarUrl); } catch (e) { return CONFIG.calendarUrl; }
    if (CONFIG.prefillCalendar) {
      // The GHL booking form's name field is full_name; first/last ride along for any form that splits them.
      u.searchParams.set('full_name', (p.first_name + ' ' + p.last_name).trim());
      ['first_name', 'last_name', 'email', 'phone'].forEach(function (k) { if (p[k]) u.searchParams.set(k, p[k]); });
    }
    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach(function (k) { if (p[k]) u.searchParams.set(k, p[k]); });
    return u.toString();
  }

  function goTop(url) {
    try { (window.top !== window.self ? window.top : window).location.href = url; }
    catch (e) { window.location.href = url; }
  }

  function renderEnd(o, p) {
    var name = p.first_name;
    var copy = {
      booking: {
        title: 'Thank you, ' + name + '.',
        body: 'Your answers are with our team. Now choose a time to speak with an Alchemy of Breath graduate.',
        cta: 'Choose your time', href: calendarLink(p)
      },
      cannot_commit: {
        title: 'Thank you, ' + name + '.',
        body: 'We only hold a call slot for someone who knows they can be there, so we won’t send you to the calendar just yet. Your answers are saved with us, and our team will be in touch by email.',
        cta: 'Breathe with us free on Sunday', href: CONFIG.freeSessionsUrl, quiet: true
      },
      not_facilitator: {
        title: 'Thank you, ' + name + '.',
        body: 'This application is for people training to hold sessions for others. For your own practice, the best place to begin is Breathe The World, our free live session every Sunday.',
        cta: 'See the free sessions', href: CONFIG.freeSessionsUrl
      },
      not_ready_to_invest: {
        title: 'Thank you for your honesty, ' + name + '.',
        body: 'The training is a real commitment, and it should arrive at the right time. Until then, breathe with us for free every Sunday. We’ll stay in touch by email.',
        cta: 'See the free sessions', href: CONFIG.freeSessionsUrl
      }
    }[o];

    var box = document.getElementById('endInner');
    box.textContent = '';
    box.appendChild(h('p', { class: 'eyebrow', text: o === 'booking' ? 'Application received · Step 2 of 2' : 'Application received' }));
    box.appendChild(h('h1', { class: 'display', tabindex: '-1', text: copy.title }));
    box.appendChild(h('p', { class: 'lede', text: copy.body }));
    box.appendChild(h('div', { class: 'actions' }, [
      h('a', { class: 'btn' + (copy.quiet ? ' btn-quiet' : ''), href: copy.href, target: '_top' }, [copy.cta, svg(ARROW)])
    ]));
    screens.end.focus = box.querySelector('h1');

    if (isDemo()) {
      box.appendChild(h('details', { class: 'demo', open: '' }, [
        h('summary', { text: 'Demo mode: this is what GHL would receive' }),
        h('p', { text: 'Nothing was sent. Outcome: ' + o + (o === 'booking' ? '. Live, this screen forwards to the calendar on its own.' : '.') }),
        h('pre', { text: JSON.stringify(p, null, 2) }),
        h('div', { class: 'actions', style: 'margin:0 16px 16px' }, [
          h('button', { type: 'button', class: 'btn btn-quiet', onclick: restart }, ['Try another path'])
        ])
      ]));
    } else if (o === 'booking') {
      box.appendChild(h('p', { class: 'note', text: 'Opening the calendar…' }));
      setTimeout(function () { goTop(copy.href); }, 1600);
    }
  }

  function restart() {
    answers = {};
    clearDraft();
    QUESTIONS.forEach(function (q) {
      var s = screens[q.id];
      if (s.input) { s.input.value = ''; s.input.style.height = ''; }
      if (s.choiceBtns) s.choiceBtns.forEach(function (b) { b.setAttribute('aria-checked', 'false'); });
      if (s.otherField) { s.otherField.hidden = true; s.otherInput.value = ''; }
      setError(q, '');
    });
    show('welcome', -1);
  }

  /* ================= KEYBOARD ================= */
  document.addEventListener('keydown', function (e) {
    if (e.isComposing || e.altKey) return;
    var t = e.target || {};
    var tag = t.tagName;
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); next(); return; }
    if (e.metaKey || e.ctrlKey) return;
    if (currentId === 'end') return;
    if (e.key === 'Enter') {
      if (tag === 'TEXTAREA' && (e.shiftKey || coarse)) return;
      if (tag === 'BUTTON' || tag === 'A') return;
      e.preventDefault();
      next();
      return;
    }
    var q = qById(currentId);
    if (q && q.type === 'choice' && tag !== 'INPUT' && tag !== 'TEXTAREA' && e.key.length === 1) {
      var i = q.keys.indexOf(e.key.toUpperCase());
      if (i > -1) { e.preventDefault(); if (q.other && i === q.options.length) chooseOther(q); else choose(q, i); }
    }
  });

  document.getElementById('navUp').addEventListener('click', prev);
  document.getElementById('navDown').addEventListener('click', next);

  /* ================= BOOT ================= */
  document.body.classList.add('no-anim');
  if (params.has('embed_page')) document.body.classList.add('embedded');
  if (isDemo()) document.getElementById('demoPill').hidden = false;
  renderWelcome();
  QUESTIONS.forEach(renderQuestion);
  renderEndShell();
  Object.keys(screens).forEach(function (id) { screens[id].el.setAttribute('aria-hidden', 'true'); screens[id].el.inert = true; });
  show('welcome', 1);
  setTimeout(function () { document.body.classList.remove('no-anim'); }, 60);

  window.AOBApplication = { config: CONFIG, answers: function () { return answers; } };
})();
</script>
</body>
</html>
