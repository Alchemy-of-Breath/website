name: Application contract

on:
  pull_request:
    paths:
      - 'facilitator-application/**'
      - 'tools/application/**'
      - 'application-lib/**'
      - 'functions/api/application/**'
      - 'migrations/**'
      - 'assets/aob-application-*.js'
      - 'wordpress-plugin/aob-pages-proxy/**'
      - '.github/workflows/application-contract.yml'
  push:
    branches: [main]
    paths:
      - 'facilitator-application/**'
      - 'tools/application/**'
      - 'application-lib/**'
      - 'functions/api/application/**'
      - 'migrations/**'
      - 'assets/aob-application-*.js'
      - 'wordpress-plugin/aob-pages-proxy/**'
      - '.github/workflows/application-contract.yml'

permissions:
  contents: read

jobs:
  application-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tools/application/test.mjs tools/application/receiver.test.mjs tools/application/meta.test.mjs tools/application/reconcile.test.mjs
